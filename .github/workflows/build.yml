name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK & AAB
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi
      - name: Build app bundle
        run: flutter build appbundle --release
      - name: Publish Android artifacts to a rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android (latest build)
          body: Automated Android build from the latest main. Contains split release APKs and the Play Store bundle.
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          make_latest: false

  windows:
    name: Windows EXE
    runs-on: windows-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath quant-rd-windows.zip
      - name: Publish Windows build to a rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Windows (latest build)
          body: Automated Windows build from the latest main. Unzip and run quant_rd.exe.
          files: quant-rd-windows.zip
          make_latest: false

  web:
    name: Web (offline demo)
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - run: flutter build web --release --no-wasm-dry-run
      - name: Zip web build
        run: cd build/web && zip -r ../../quant-rd-web.zip .
      - name: Publish web build to a rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-latest
          name: Web (latest build)
          body: Automated web build from the latest main. Unzip and serve the folder.
          files: quant-rd-web.zip
          make_latest: false
