# Analyzer and lint configuration.
#
# This project runs with STRICT type checking. A trading engine that silently
# casts a dynamic into a double, or infers a type it never checked, is a
# correctness risk in exactly the place it matters most, so the strict flags are
# on and the build fails rather than shrugging.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Correctness issues are errors, not hints.
    invalid_use_of_visible_for_testing_member: error
    invalid_use_of_protected_member: error
    missing_required_param: error
    missing_return: error
    todo: ignore

  exclude:
    - build/**
    - android/**
    - web/**
    - windows/**

linter:
  rules:
    # --- Correctness ---
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_type_to_string: true
    cancel_subscriptions: true
    close_sinks: true
    collection_methods_unrelated_type: true
    no_adjacent_strings_in_list: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true
    unrelated_type_equality_checks: true
    valid_regexps: true

    # --- Async discipline ---
    unawaited_futures: true
    discarded_futures: true
    avoid_void_async: true

    # --- Immutability and clarity ---
    prefer_final_locals: true
    prefer_final_in_for_each: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_single_quotes: true
    use_super_parameters: true

    # Deliberately NOT enabled:
    #   avoid_slow_async_io — it pushes you toward the *synchronous* dart:io
    #     calls, which block the UI thread. Async IO is the correct choice in a
    #     Flutter app, so this rule would make the app worse, not safer.

    # --- Robustness ---
    avoid_returning_null_for_void: true
    avoid_equals_and_hash_code_on_mutable_classes: true
    noop_primitive_operations: true
    prefer_void_to_null: true
